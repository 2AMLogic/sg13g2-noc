name: signoff

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Spec table and its machine-readable rendering agree
        run: |
          # spec/noc.md section 1 vs spec/noc.rows.json (the rendering cited as
          # item-6 evidence). No klt, no PDK: first check, fails fast.
          python3 -I spec/check-rows.py

      - name: Validate committed JSON parses
        run: |
          python3 -I - <<'PY'
          import json, pathlib, sys
          bad = 0
          files = sorted(pathlib.Path("manifests").rglob("*.json"))
          for p in files:
              try:
                  json.loads(p.read_text())
              except ValueError as e:
                  print(f"::error file={p}::{e}")
                  bad += 1
          print(f"checked {len(files)} JSON file(s)")
          sys.exit(1 if bad else 0)
          PY

      - name: Bench harness anti-false-pass invariants still hold
        run: |
          # Hermetic: cocotb_tools.runner is stubbed, so this needs neither
          # cocotb nor Icarus. It is the only bench check CI can run -- item 9's
          # cold start below is local_only and carries its committed outcome.
          python3 -I verification/selftest_lib_bench.py

      - name: Mesh build declarations agree (bench vs klt request)
        run: |
          # Hermetic: run_bench.py is imported with cocotb_tools stubbed and
          # never built or run, so this needs neither cocotb nor Icarus. It
          # compares the bench's declaration (run_bench.py plus lib_bench.py's
          # TIMESCALE/BUILD_ARGS) against klt-request-common.json field by
          # field -- the duplication issue #109 left behind (issue #114).
          python3 -I verification/check_mesh_build_agreement.py

      - name: fv.sh request assembly and bench imports resolve
        run: |
          # Hermetic guard on the klt functional-verification path (issue #122),
          # the driver of the attested item-5 envelopes, which CI cannot run
          # (item 9's cold start is local_only). fv.sh --emit-requests hands the
          # checker its own request assembly and Python path, so a hoist like
          # ecf7ae5 (bench_vocab) fails here instead of standing on main. No
          # simulator, no cocotb, no klt, no network.
          python3 -I verification/check_fv_requests.py

      - name: Install pinned klayout-tools
        run: pip install "klayout-tools==$(cat .github/klt-version)"

      - name: Grade the manifest (exit 0 or 3 are valid grader runs)
        run: |
          rc=0
          klt signoff --manifest manifests/sg13g2-noc.json --format json > /dev/null || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff errored (exit $rc)"
            exit 1
          fi

      - name: Committed verdict of record still reproduces
        run: |
          # --check: exit 0 = match, 3 = drifted, 1 = missing/unparseable.
          # Only 0 passes. `build` provenance is excluded from the comparison.
          klt signoff --manifest manifests/sg13g2-noc.json --format json \
            --check manifests/sg13g2-noc.signoff.json

      - name: Item 1 attestation still reproduces
        run: |
          # RTL sources, committed netlist and its freshness check (layout/mesh/check.sh).
          klt signoff --attest 1 --inventory manifests/attest/item1-inventory.json \
            --check manifests/attest/item1.json

      - name: Item 10 (repo hygiene) attestation still reproduces
        run: |
          # --check re-runs the CI-runnable checks and skips local_only ones,
          # carrying their committed outcome. Only exit 0 passes.
          klt signoff --attest 10 --inventory attest/item10.json \
            --check evidence/item10.json

      - name: Item 9 (testbenches shipped) attestation still reproduces
        run: |
          # Testbench files and pins are re-checked; the cold start is local_only
          # (needs Icarus and cocotb), so its committed outcome is carried.
          klt signoff --attest 9 --inventory attest/item9.json \
            --check evidence/item9.json
